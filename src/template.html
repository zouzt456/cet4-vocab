<style>
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,"Segoe UI","Microsoft YaHei",sans-serif;background:#f5f6f8;color:#1d2129}
header{background:#fff;border-bottom:1px solid #e5e6eb;padding:6px 20px 0;position:sticky;top:0;z-index:5}
h1{margin:0 0 10px;font-size:23px;display:flex;align-items:baseline;gap:10px}

nav{display:flex;gap:6px}

main{max-width:1580px;margin:0 auto;padding:14px 28px 18px}
section{display:none}

.word{font-size:60px;font-weight:700;letter-spacing:.5px;word-break:break-word;line-height:1.2}
.ph{margin-top:6px;color:#86909c;font-size:19px;display:flex;align-items:center;gap:10px;min-height:30px}

.ans{margin-top:12px;padding-top:12px;border-top:1px dashed #e5e6eb;font-size:21px;line-height:1.72;white-space:pre-line;flex:1 1 auto;display:flex;flex-direction:column;min-height:0}

.hidden{display:none}

.wrap{display:flex;gap:16px;align-items:flex-start}
.cards{display:flex;gap:16px;flex:1 1 auto;min-width:0;min-height:calc(100vh - 252px);align-items:stretch}

.card2{display:none;cursor:pointer;flex-direction:column}

.card2 .c2head{font-size:15px;color:#86909c;font-weight:600}

.row:last-child{border-bottom:0}

.row.open .t{white-space:pre-line;overflow:visible}
.row .egs{display:none;margin-top:9px;padding-top:9px;border-top:1px dashed #eef0f3}
.row.open .egs{display:block}
.row .eg{padding:8px 10px;margin-bottom:6px}
.row .eg .en{font-size:14px}
.row .eg .zh{font-size:13px}
.row .emptyEg{color:#a9aeb8;font-size:13px;background:none;border-left:0}
.contd{color:#86909c;font-size:13px;margin:10px 0 2px}
.row .d{color:#86909c;font-size:12px;margin-top:6px;display:flex;gap:14px;flex-wrap:wrap}
.empty{padding:40px;text-align:center;color:#a9aeb8}

footer button{border:0;background:none;color:#c9cdd4;cursor:pointer;font-size:12px;text-decoration:underline}
.meta input.jump{border:1px solid #dcdfe6;border-radius:8px;padding:6px 10px;font-size:14px;width:170px;background:#fff;color:#1d2129;font-family:inherit}
.meta input.jump:focus{outline:none;border-color:#94bfff;box-shadow:0 0 0 3px rgba(64,128,255,.10)}
.meta input.jump::placeholder{color:#c0c4cc}
.row .w{display:flex;align-items:center;gap:8px}
.row .tocard{border:1px solid #e5e6eb;background:#fff;color:#4080ff;font-size:12px;line-height:1;padding:5px 8px;border-radius:6px;cursor:pointer;margin-left:auto;flex:0 0 auto}
.row .tocard:hover{border-color:#94bfff;background:#f2f6ff}

<div class="mask hidden" id="syncMask">
  <div class="modal">
    <div class="mhead"><span>同步生词本与进度</span><button id="syncClose" title="关闭">×</button></div>

      <button id="bExport">生成/刷新</button>

    <div class="mtips" id="cfMsg"></div>

<script>
var C={w:0,ph:1,tr:2,ex:3,col:4,ox:5,bnc:6,frq:7,tag:8,pos:9,def:10};
var DATA=__DATA__;
var EX=__EX__;
var SRC={ted:'TED 演讲',news:'News Commentary 新闻评论',qed:'QED 字幕语料',wm:'WikiMatrix 维基例句'};
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function escRe(s){return s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');}
function formsOf(w){
  var out={},base=String(w[C.w]||'').toLowerCase(),i,j;
  if(base)out[base]=1;
  var s=String(w[C.ex]||'').split('/');
  for(i=0;i<s.length;i++){
    var p=s[i].split(':');
    var v=(p.length>1?p[1]:p[0]||'').trim().toLowerCase();
    if(!v||!/^[a-z'’-]+$/.test(v))continue;
    out[v]=1;
    if(v.slice(-3)==='ies')out[v.slice(0,-3)+'y']=1;
    if(v.slice(-2)==='es')out[v.slice(0,-1)]=1;
  }
  var keys=Object.keys(out);
  for(i=0;i<keys.length;i++){
    var k=keys[i];
    var vs=[k.replace(/our/g,'or'),k.replace(/tre$/,'ter'),k.replace(/re$/,'er'),
            k.replace(/ce$/,'se'),k.replace(/se$/,'ce'),k.replace(/ise$/,'ize'),
            k.replace(/ize$/,'ise'),k.replace(/yse$/,'yze'),k.replace(/ogue$/,'og'),
            k.replace(/ll([aeiou])/g,'l$1'),k.replace(/ae/g,'e'),k.replace(/oe/g,'e'),
            k.replace(/tre(s?)$/,'ter$1'),k.replace(/mme$/,'m'),
            k.indexOf('-')>=0?k.replace(/-/g,' '):'',k.indexOf('-')>=0?k.replace(/-/g,''):''];
    for(j=0;j<vs.length;j++){if(vs[j]&&vs[j]!==k&&/^[a-z'’ -]+$/.test(vs[j]))out[vs[j]]=1;}
  }
  var hyph=String(w[C.w]||'').replace(/ /g,'-');if(hyph!==base)out[hyph]=1;
  return Object.keys(out);
}
var ZH_STOP={'的':1,'了':1,'地':1,'得':1,'着':1,'和':1,'与':1,'在':1,'是':1,'就':1,'也':1,'都':1,'很':1,'不':1,'把':1,'被':1,'给':1,'让':1,'会':1,'能':1,'要':1,'可':1,'以':1,'而':1,'且':1,'或':1,'等':1,'一':1,'些':1,'上':1,'下':1,'里':1,'中':1,'外':1,'人':1,'大':1,'小':1,'多':1,'少':1,'好':1,'老':1,'个':1,'这':1,'那':1,'他':1,'她':1,'它':1};
function glossesOf(w){
  var t=String(w[C.tr]||'').replace(/\[[^\]]*\]/g,'\n');
  var runs=t.match(/[\u4e00-\u9fff]+/g)||[],out={},i,k;
  function add(g){
    if(!g)return;
    if(g.length>=2){
      out[g]=1;
      var core=g.replace(/[的地得了着过]+$/,'');
      if(core!==g&&core.length>=2)out[core]=1;
      for(k=0;g.length>=3&&k+2<=g.length;k++){
        var b=g.slice(k,k+2);
        if(!/[的地得了着过吗呢吧啊]/.test(b))out[b]=1;
      }
    } else if(!ZH_STOP[g]) out[g]=1;
  }
  for(i=0;i<runs.length;i++)add(runs[i]);
  return Object.keys(out).sort(function(a,b){return b.length-a.length;});
}
function markEn(text,forms){
  if(!forms.length)return text;
  var re=new RegExp('(^|[^A-Za-z])('+forms.map(escRe).join('|')+')(?=[^A-Za-z]|$)','gi');
  return text.replace(re,function(m,p1,p2){return p1+'<mark>'+p2+'</mark>';});
}
function markZh(text,glosses){
  if(!glosses.length)return text;
  var re=new RegExp('('+glosses.map(escRe).join('|')+')','g');
  return text.replace(re,function(m){return '<mark>'+m+'</mark>';});
}

/* ---- 状态 ---- */
var LS='cet4-pos-v1';
var LSS='cet4-stars-v1';
var stars={};
try{var stv=JSON.parse(localStorage.getItem(LSS)||'{}');if(stv&&typeof stv==='object'){for(var sk in stv){if(stv[sk])stars[sk]=1;}}}catch(e){}
var pref={order:'bnc',mode:'all'};
/* 每个模式各自记住停在第几张：切回来回到该模式自己的位置，不会跳到另一个模式的卡片 */
var slotAll=0,slotStar=0;
try{var sv=JSON.parse(localStorage.getItem(LS)||'{}');if(sv&&typeof sv==='object'){if(sv.order)pref.order=sv.order;if(sv.mode==='star'||sv.mode==='all')pref.mode=sv.mode;if(typeof sv.i==='number'&&sv.i>=0)slotAll=sv.i;if(typeof sv.s==='number'&&sv.s>=0)slotStar=sv.s;}}catch(e){}
var orderArr=[],pos=0,cur=null,shown=true;

function $(id){return document.getElementById(id);}
function keepCur(){if(pref.mode==='star')slotStar=pos;else slotAll=pos;}
function slotOf(m){return m==='star'?slotStar:slotAll;}
function save(){keepCur();try{localStorage.setItem(LS,JSON.stringify({order:pref.order,mode:pref.mode,i:slotAll,s:slotStar}));}catch(e){}}

function speak(t){try{var u=new SpeechSynthesisUtterance(t);u.lang='en-US';u.rate=.9;window.speechSynthesis.cancel();window.speechSynthesis.speak(u);}catch(e){}}
function keyOf(w){return String(w[C.w]||'').toLowerCase();}
function isStar(w){return !!stars[keyOf(w)];}
function saveStars(){try{localStorage.setItem(LSS,JSON.stringify(stars));}catch(e){}}
function paintStars(){var n=0,k;for(k in stars){if(stars[k])n++;}$('starN').textContent=String(n);$('starN').className=n?'badge':'badge hidden';}
function syncStar(){if(!cur)return;$('star').textContent=isStar(cur)?'★':'☆';$('star').title=isStar(cur)?'已在生词本（点这里取消）':'加入生词本';}
function exOf(w){return EX[w[C.w]]||EX[String(w[C.w]||'').toLowerCase()]||[];}

function buildOrder(){
  var arr=[],i;
  for(i=0;i<DATA.length;i++){if(pref.mode==='star'&&!stars[keyOf(DATA[i])])continue;arr.push(i);}
  if(pref.order==='alpha'){
    arr.sort(function(a,b){var x=String(DATA[a][C.w]).toLowerCase(),y=String(DATA[b][C.w]).toLowerCase();return x<y?-1:(x>y?1:0);});
  } else if(pref.order==='rand'){
    for(i=arr.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=arr[i];arr[i]=arr[j];arr[j]=t;}
  }
  orderArr=arr;
  if(pos>arr.length-1)pos=arr.length-1;
}

/* 换顺序 / 换模式后尽量停在原来那个词上，不要回到第 1 张 */
function keepWord(){
  var key=cur?keyOf(cur):null,fallback=pos,i;
  buildOrder();
  if(key){
    for(i=0;i<orderArr.length;i++){if(keyOf(DATA[orderArr[i]])===key){pos=i;return;}}
  }
  if(fallback>orderArr.length-1)fallback=Math.max(0,orderArr.length-1);
  pos=fallback<0?0:fallback;
}

function egNode(w,it,fs,gs){
  var eg=document.createElement('div');eg.className='eg';
  var en=document.createElement('div');en.className='en';en.innerHTML=markEn(esc(it[0]),fs);
  var zh=document.createElement('div');zh.className='zh';zh.innerHTML=markZh(esc(it[1]),gs);
  var sr=document.createElement('span');sr.className='src';sr.textContent='— '+(SRC[it[2]]||it[2]||'');
  eg.appendChild(en);eg.appendChild(zh);eg.appendChild(sr);
  return eg;
}

function renderCard(){
  if(!orderArr.length){
    cur=null;shown=true;
    $('cword').textContent='—';$('cph').textContent='';$('cans').innerHTML='';
    $('chint').textContent='生词本还是空的：背单词时点右上角 ☆ 或按 f 收藏，再回到这里就能只背生词';
    $('card2').className='card card2';
    $('cnt').textContent='0 / 0';
    $('pmeta').textContent='只背生词 · 还没有生词';
    $('pfill').style.width='0%';
    $('bPrev').disabled=true;$('bNext').disabled=true;
    return;
  }
  if(pos<0)pos=0; if(pos>orderArr.length-1)pos=orderArr.length-1;
  var w=DATA[orderArr[pos]],list=exOf(w);cur=w;
  $('cword').textContent=w[C.w];
  $('cph').textContent=w[C.ph]||'';
  var ans=$('cans');ans.innerHTML='';
  var fs=formsOf(w),gs=glossesOf(w),i;
  var narrow=(typeof window!=='undefined'&&window.innerWidth&&window.innerWidth<=1100);
  var leftN=list.length>2?1:list.length;
  var d=document.createElement('div');d.textContent=w[C.tr];ans.appendChild(d);
  if(list.length){
    var wrap=document.createElement('div');wrap.className='egs';
    var hd=document.createElement('div');hd.className='hd';
    hd.textContent='真实例句 · 中英对照（'+list.length+'）'+(list.length>2?'　·　其余 '+(list.length-1)+' 条在'+(narrow?'下方':'右卡'):'');
    wrap.appendChild(hd);
    var egl=document.createElement('div');egl.className='eglist';
    for(i=0;i<leftN;i++)egl.appendChild(egNode(w,list[i],fs,gs));
    wrap.appendChild(egl);
    ans.appendChild(wrap);
  }
  ans.className=shown?'ans':'ans hidden';

  var c2=$('card2'),rest=list.length-leftN;
  if(rest>0){
    $('c2head').textContent=w[C.w]+' · 其余 '+rest+' 条例句';
    var a2=$('c2ans');a2.innerHTML='';
    var w2=document.createElement('div');w2.className='egs';
    var eg2=document.createElement('div');eg2.className='eglist';
    for(i=leftN;i<list.length;i++)eg2.appendChild(egNode(w,list[i],fs,gs));
    w2.appendChild(eg2);
    a2.appendChild(w2);
    a2.className=shown?'ans':'ans hidden';
    c2.className='card card2 on';
    $('cards').className='cards duo';
  } else {
    $('c2head').textContent='';
    $('c2ans').innerHTML='';
    c2.className='card card2';
    $('cards').className='cards';

  }

  syncStar();
  $('chint').textContent='空格：「收起 / 展开释义」　·　‹ › ← →：翻词　·　s 发音　·　f 收藏　·　d 夜间模式';
  var wp=pos+1;
  $('cnt').textContent=wp+' / '+orderArr.length;
  var pct=(wp/orderArr.length*100).toFixed(2);
  $('pmeta').textContent='进度 '+pct+'%　·　第 '+wp+' 词 / 共 '+orderArr.length+' 词';
  $('pfill').style.width=pct+'%';
  $('bPrev').disabled=pos<=0;
  $('bNext').disabled=pos>=orderArr.length-1;
  $('bToggle').textContent=shown?'收起释义':'展开释义';
}

function toggleAns(){
  shown=!shown;
  $('cans').className=shown?'ans':'ans hidden';
  var a2=$('c2ans');
  if(a2)a2.className=shown?'ans':'ans hidden';
  $('bToggle').textContent=shown?'收起释义':'展开释义';
}
function go(d){var n=pos+d;if(n<0||n>=orderArr.length)return;pos=n;shown=true;save();renderCard();}

$('star').addEventListener('click',function(e){
  e.stopPropagation();
  if(!cur)return;
  var k=keyOf(cur);
  if(stars[k])delete stars[k]; else stars[k]=1;
  saveStars();paintStars();syncStar();refreshMode();
  if($('v-stars').className.indexOf('on')>=0)renderStars();
});
$('spk').addEventListener('click',function(e){e.stopPropagation();if(cur)speak(cur[C.w]);});
$('bPrev').addEventListener('click',function(){go(-1);});
$('bToggle').addEventListener('click',function(){toggleAns();});
$('bNext').addEventListener('click',function(){go(1);});
function refreshMode(){if(pref.mode!=='star')return;var at=pos;buildOrder();if(pos>orderArr.length-1)pos=Math.max(0,orderArr.length-1);save();renderCard();}
$('mode').addEventListener('change',function(){
  keepCur();                       /* 先把当前模式的位置存进它自己的槽 */
  pref.mode=this.value;
  buildOrder();
  pos=slotOf(pref.mode);           /* 回到该模式上次停的那一张 */
  if(pos<0)pos=0;
  if(pos>orderArr.length-1)pos=Math.max(0,orderArr.length-1);
  shown=true;save();renderCard();
});
$('order').addEventListener('change',function(){
  pref.order=this.value;keepWord();save();renderCard();
});

document.addEventListener('keydown',function(e){
  var _k0=e.key;
  if(_k0==='Escape'){closeConfirm();closeSync();closeMenu();return;}
  if($('v-card').className.indexOf('on')<0)return;
  if(confirmOpen())return;
  var _mm=$('syncMask');
  if(_mm&&_mm.className.indexOf('mask')>=0&&_mm.className.indexOf('hidden')<0)return;
  var _ae=document.activeElement;
  if(_ae&&(_ae.tagName==='INPUT'||_ae.tagName==='TEXTAREA'))return;
  var k=e.key;
  if(e.code==='Space'){e.preventDefault();toggleAns();}
  else if(k==='ArrowLeft'||k==='<'||k===','||k==='，'){e.preventDefault();go(-1);}
  else if(k==='ArrowRight'||k==='>'||k==='.'||k==='。'){e.preventDefault();go(1);}
  else if(k==='s'||k==='S'){if(cur)speak(cur[C.w]);}
  else if(k==='f'||k==='F'){if(cur){var kk=keyOf(cur);if(stars[kk])delete stars[kk];else stars[kk]=1;saveStars();paintStars();syncStar();refreshMode();}}
  else if(k==='d'||k==='D'){setTheme(!dark);}
});

/* ---- tabs ---- */
var tabs=document.querySelectorAll('nav button');
function activate(v){
  for(var k=0;k<tabs.length;k++){
    if(tabs[k].getAttribute('data-v')===v)tabs[k].className='on'; else tabs[k].className='';
  }
  $('v-card').className=(v==='card')?'on':'';
  $('v-list').className=(v==='list')?'on':'';
  $('v-stars').className=(v==='stars')?'on':'';
  if(v==='list')renderList();
  if(v==='stars')renderStars();
}
for(var t=0;t<tabs.length;t++){
  tabs[t].addEventListener('click',function(){activate(this.getAttribute('data-v'));});
}

/* ---- 跳到某个词 ---- */
function dataIndexOfQ(q){
  q=String(q||'').trim().toLowerCase();
  if(!q)return -1;
  var i;
  for(i=0;i<DATA.length;i++){if(keyOf(DATA[i])===q)return i;}
  var hit=-1,cnt=0;
  for(i=0;i<DATA.length;i++){if(keyOf(DATA[i]).indexOf(q)===0){if(hit<0)hit=i;cnt++;}}
  return cnt===1?hit:-1;
}
function jumpToWord(di){
  if(di<0||di>=DATA.length)return false;
  var w=DATA[di],k=keyOf(w);
  if(pref.mode==='star'&&!stars[k]){pref.mode='all';$('mode').value='all';}
  buildOrder();
  var j=orderArr.indexOf(di);
  if(j<0){ /* 顺序里不该出现 */ buildOrder(); j=orderArr.indexOf(di); }
  if(j<0)return false;
  pos=j;shown=true;save();renderCard();activate('card');
  return true;
}
$('jump').addEventListener('keydown',function(e){
  if(e.key!=='Enter')return;
  e.preventDefault();e.stopPropagation();
  var q=String(this.value||'').trim();
  if(!q)return;
  var di=dataIndexOfQ(q);
  if(di>=0&&jumpToWord(di)){this.value='';this.placeholder='跳到某个词…';return;}
  this.placeholder='没找到「'+q+'」';
  var self=this;
  setTimeout(function(){self.placeholder='跳到某个词…';},1600);
});

/* ---- list / stars ---- */
function rowHtml(w,i,open){
  return '<div class="row'+(open?' open':'')+'" data-i="'+i+'"><div class="w">'+esc(w[C.w])+(w[C.ph]?'<em>'+esc(w[C.ph])+'</em>':'')+'<button class="tocard" data-i="'+i+'" title="跳到这张卡">看卡片 ›</button></div><div class="t">'+esc(w[C.tr])+'</div></div>';
}
function starRowHtml(w,i){
  var k=keyOf(w);
  return '<div class="row" data-i="'+i+'"><div class="w"><button class="st" data-k="'+esc(k)+'" title="移出生词本">★</button>'+esc(w[C.w])+(w[C.ph]?'<em>'+esc(w[C.ph])+'</em>':'')+'<button class="tocard" data-i="'+i+'" title="跳到这张卡">看卡片 ›</button></div><div class="t">'+esc(w[C.tr])+'</div></div>';
}
function rowEgsHtml(w){
  var list=exOf(w);
  if(!list.length)return '<div class="egs"><div class="eg emptyEg">这个词暂无例句</div></div>';
  var fs=formsOf(w),gs=glossesOf(w),h='<div class="egs">';
  for(var i=0;i<list.length;i++){
    var it=list[i];
    h+='<div class="eg"><div class="en">'+markEn(esc(it[0]),fs)+'</div><div class="zh">'+markZh(esc(it[1]),gs)+'</div><span class="src">— '+esc(SRC[it[2]]||it[2]||'')+'</span></div>';
  }
  return h+'</div>';
}
function toggleRow(e,root){
  var r=e.target&&e.target.closest?e.target.closest('.row'):null;
  if(!r||r.parentNode!==root)return;
  if(r.getAttribute('data-eg')!=='1'){
    var i=parseInt(r.getAttribute('data-i'),10);
    r.innerHTML+=rowEgsHtml(DATA[i]);
    r.setAttribute('data-eg','1');
  }
  r.classList.toggle('open');
}
function renderList(){
  var q=($('q').value||'').trim().toLowerCase();
  var out=[],n=0,i;
  for(i=0;i<DATA.length;i++){
    var w=DATA[i];
    var hit=!q||String(w[C.w]).toLowerCase().indexOf(q)>=0||String(w[C.tr]||'').toLowerCase().indexOf(q)>=0;
    if(!hit)continue;
    n++;if(out.length<400)out.push(rowHtml(w,i,false));
  }
  $('listTips').textContent=q?('匹配 '+n+' 条'+(n>400?'，仅显示前 400 条':'')+'，点击展开释义和例句'):('全部 '+DATA.length+' 条，点击展开释义和例句');
  $('list').innerHTML=out.join('')||'<div class="empty">没有找到，换个词试试</div>';
}
function renderStars(){
  var out=[],i,w;
  for(i=0;i<DATA.length;i++){w=DATA[i];if(stars[keyOf(w)])out.push(starRowHtml(w,i));}
  $('starTips').textContent=out.length?('生词本 '+out.length+' 个（点词条展开释义和例句，点 ★ 移出）'):'生词本还是空的：背单词时点卡片右上角 ☆ 或按 f 收藏';
  $('starList').innerHTML=out.join('')||'<div class="empty">暂无生词</div>';
}
$('q').addEventListener('input',function(){renderList();});
function listClick(e,root){
  var b=e.target&&e.target.closest?e.target.closest('.tocard'):null;
  if(b){e.stopPropagation();jumpToWord(Number(b.getAttribute('data-i')));return true;}
  return false;
}
$('list').addEventListener('click',function(e){if(listClick(e,$('list')))return;toggleRow(e,$('list'));});
$('starList').addEventListener('click',function(e){
  var b=e.target&&e.target.closest?e.target.closest('.st'):null;
  if(b){
    e.stopPropagation();
    var k=b.getAttribute('data-k');
    if(stars[k])delete stars[k];
    saveStars();paintStars();renderStars();syncStar();
    return;
  }
  if(listClick(e,$('starList')))return;
  toggleRow(e,$('starList'));
});

/* ---- 夜间模式 ---- */
var LS_THEME='cet4-theme-v1';
var dark=false;
function applyTheme(d){
  dark=!!d;
  var root=document.documentElement;
  if(root)root.className=dark?'dark':'';
  var ic=$('miThemeIc'),tx=$('miThemeTx');
  if(ic)ic.textContent=dark?'☀️':'🌙';
  if(tx)tx.textContent=dark?'日间模式':'夜间模式';
  var mb=$('menu');
  if(mb)mb.title=dark?'菜单（当前夜间）':'菜单（当前日间）';
  /* 安卓 App 里同步状态栏颜色（浏览器里没有这个对象，忽略即可） */
  try{if(window.AndroidTheme&&window.AndroidTheme.setDark)window.AndroidTheme.setDark(dark);}catch(e){}
}
function setTheme(d){
  applyTheme(d);
  try{localStorage.setItem(LS_THEME,d?'dark':'light');}catch(e){}
}
(function initTheme(){
  var v=null;try{v=localStorage.getItem(LS_THEME);}catch(e){}
  if(v==='dark'||v==='light'){applyTheme(v==='dark');return;}
  var sys=false;try{sys=!!(window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches);}catch(e){}
  applyTheme(sys);
})();
/* 右上角 ☰ 菜单：夜间模式 + 同步，合成一个入口，免得按钮挤在一起盖住生词本 */
function openMenu(){
  var n=0,k;for(k in stars){if(stars[k])n++;}
  var t=$('miClearTx');if(t)t.textContent=n?('清空生词本（'+n+'）'):'清空生词本';
  var b=$('menuBox');if(b)b.className='sheet';
}
function closeMenu(){var b=$('menuBox');if(b)b.className='sheet hidden';}
function toggleMenu(){var b=$('menuBox');if(!b)return;if(b.className.indexOf('hidden')<0)closeMenu();else openMenu();}
$('menu').addEventListener('click',function(e){if(e&&e.stopPropagation)e.stopPropagation();toggleMenu();});
$('miTheme').addEventListener('click',function(e){if(e&&e.stopPropagation)e.stopPropagation();setTheme(!dark);closeMenu();});
$('miSync').addEventListener('click',function(e){if(e&&e.stopPropagation)e.stopPropagation();closeMenu();openSync();});
$('miFirst').addEventListener('click',function(e){if(e&&e.stopPropagation)e.stopPropagation();closeMenu();askGotoFirst();});
$('miClearStars').addEventListener('click',function(e){if(e&&e.stopPropagation)e.stopPropagation();closeMenu();askClearStars();});

/* ---- 通用确认弹窗（自己画：安卓 WebView 没配 WebChromeClient，window.confirm 不弹且默认当取消） ---- */
var _cfFn=null;
function askConfirm(title,msg,yesText,fn){
  $('cfTitle').textContent=title;
  $('cfMsg').textContent=msg;
  $('cfYes').textContent=yesText||'确定';
  _cfFn=fn||null;
  $('cfMask').className='mask';
}
function closeConfirm(){var m=$('cfMask');if(m)m.className='mask hidden';_cfFn=null;}
function confirmOpen(){var m=$('cfMask');if(!m)return false;var c=m.className||'';return c.indexOf('mask')>=0&&c.indexOf('hidden')<0;}
$('cfNo').addEventListener('click',closeConfirm);
$('cfClose').addEventListener('click',closeConfirm);
$('cfMask').addEventListener('click',function(e){if(e.target===this)closeConfirm();});
$('cfYes').addEventListener('click',function(){var f=_cfFn;closeConfirm();if(f)f();});

function curWordText(){return cur?String(cur[C.w]):'';}
function askGotoFirst(){
  if(!orderArr.length){askConfirm('回到第一个词？','现在没有可背的词，先去生词本加几个吧。','知道了',null);return;}
  askConfirm('回到第一个词？','你现在停在第 '+(pos+1)+' 个词（共 '+orderArr.length+' 个）'+(curWordText()?'，就是 '+curWordText():'')+'。回去后要从头翻，生词本和收藏不会动。','回到第一个词',function(){
    slotAll=0;slotStar=0;pos=0;shown=true;save();renderCard();activate('card');
  });
}
function askClearStars(){
  var n=0,k;for(k in stars){if(stars[k])n++;}
  if(!n){askConfirm('生词本已经是空的','还没有收藏过单词，看到想记的点卡片右上角的 ☆ 就行。','知道了',null);return;}
  askConfirm('清空生词本？','会移除全部 '+n+' 个收藏词，背单词进度不受影响，但清空后不能撤销。','清空',function(){
    stars={};saveStars();paintStars();
    buildOrder();pos=slotOf(pref.mode);if(pos>orderArr.length-1)pos=Math.max(0,orderArr.length-1);
    save();renderCard();syncStar();
    try{renderStars();}catch(e){}
  });
}

/* ---- 同步：导出/导入（2026-10-23 加） ---- */
var SYNC_APP='cet4-vocab';
var SYNC_SCHEMA=1;
function exportedStars(){
  var st={},k;
  for(k in stars){if(stars[k])st[k]=1;}
  return st;
}
function collectState(){
  keepCur();
  var st=exportedStars(),n=Object.keys(st).length;
  return {
    app:SYNC_APP,schema:SYNC_SCHEMA,exportedAt:new Date().toISOString(),
    stats:{words:DATA.length,stars:n,order:pref.order,mode:pref.mode},
    data:{pos:{order:pref.order,mode:pref.mode,i:slotAll,s:slotStar},stars:st}
  };
}
function stateText(){return JSON.stringify(collectState(),null,1);}
function syncMsg(t,err){var m=$('syncMsg');if(!m)return;m.textContent=t||'';m.style.color=err?'#d03050':'#2f6fed';}
function applyState(o){
  if(!o||typeof o!=='object')throw new Error('内容不是对象');
  if(o.app!==SYNC_APP)throw new Error('不是本应用的同步数据（缺少 app=cet4-vocab）');
  if(!o.data||typeof o.data!=='object')throw new Error('缺少 data 段');
  var d=o.data,st={},k;
  if(!d.stars||typeof d.stars!=='object')throw new Error('缺少生词本数据');
  var got=0;
  for(k in d.stars){if(d.stars[k]){got++;if(isWordKey(k))st[k]=1;}}
  if(got&&!Object.keys(st).length)throw new Error('生词本里的词和本词表对不上（'+got+' 个都不认识）');
  try{localStorage.setItem(LS_BAK,JSON.stringify({at:new Date().toISOString(),pos:{order:pref.order,mode:pref.mode,i:slotAll,s:slotStar},stars:exportedStars()}));}catch(e){}
  stars=st;
  var p=(d.pos&&typeof d.pos==='object')?d.pos:{};
  pref.order=(p.order==='alpha'||p.order==='rand')?p.order:'bnc';
  pref.mode=(p.mode==='star')?'star':'all';
  slotAll=(typeof p.i==='number'&&p.i>=0)?Math.floor(p.i):0;
  slotStar=(typeof p.s==='number'&&p.s>=0)?Math.floor(p.s):0;
  saveStars();save();
  $('order').value=pref.order;
  $('mode').value=pref.mode;
  paintStars();buildOrder();
  pos=slotOf(pref.mode);
  if(pos<0)pos=0;
  if(pos>orderArr.length-1)pos=Math.max(0,orderArr.length-1);
  shown=true;renderCard();syncStar();
  try{renderList();renderStars();}catch(e){}
  return {stars:Object.keys(stars).length,pos:pos,mode:pref.mode};
}
var LS_BAK='cet4-sync-bak-v1';
var WORDKEYS=null;
function isWordKey(k){
  if(!WORDKEYS){WORDKEYS={};for(var i=0;i<DATA.length;i++)WORDKEYS[keyOf(DATA[i])]=1;}
  return !!WORDKEYS[String(k||'').toLowerCase()];
}
function cleanJson(txt){
  var s=String(txt||'').replace(/^\uFEFF/,'').trim();
  /* 手机输入法常把英文引号换成全角，先洗一遍再解析 */
  s=s.replace(/[\u201C\u201D\uFF02]/g,'"').replace(/[\u2018\u2019\uFF07]/g,"'");
  var a=s.indexOf('{'),b=s.lastIndexOf('}');
  if(a>=0&&b>a)s=s.slice(a,b+1);
  return s;
}
function hasBackup(){try{return !!localStorage.getItem(LS_BAK);}catch(e){return false;}}
function undoImport(){
  var raw=null;try{raw=localStorage.getItem(LS_BAK);}catch(e){}
  if(!raw){syncMsg('没有可撤销的导入记录',true);return false;}
  var o=JSON.parse(raw);
  var ob={app:SYNC_APP,data:{stars:o.stars||{},pos:o.pos||{}}};
  applyState(ob);
  try{localStorage.removeItem(LS_BAK);}catch(e){}
  syncMsg('已撤销上一次导入，回到导入前的进度');
  return true;
}
function openSync(){
  var m=$('syncMask');if(!m)return;
  var isAnd=!!(window&&window.AndroidTheme);   /* 安卓 WebView 里下载/选文件都不弹，按钮直接隐藏，免得点了个没反应 */
  var d=$('bDownload'),p=$('bPick');
  if(d)d.style.display=isAnd?'none':'';
  if(p)p.style.display=isAnd?'none':'';
  var u=$('bUndo');if(u)u.style.display=hasBackup()?'':'none';
  $('syncTxt').value=stateText();
  try{$('syncTxt').scrollTop=0;}catch(e){}
  m.className='mask';
  syncMsg('已生成当前进度（生词本 '+Object.keys(exportedStars()).length+' 个）。复制到另一台粘进去点「导入」即可。');
  try{setTimeout(function(){try{var t=$('syncTxt');t.focus();t.select();t.scrollTop=0;}catch(e){}},30);}catch(e){}
}
function closeSync(){var m=$('syncMask');if(m)m.className='mask hidden';}
$('syncClose').addEventListener('click',closeSync);
$('syncMask').addEventListener('click',function(e){if(e.target===this)closeSync();});
$('bExport').addEventListener('click',function(){$('syncTxt').value=stateText();syncMsg('已生成，点「复制」或「下载 .json」带走');});
$('bCopy').addEventListener('click',function(){
  var t=$('syncTxt').value||stateText();$('syncTxt').value=t;
  function done(){syncMsg('已复制到剪贴板');}
  function fallback(){try{$('syncTxt').select();document.execCommand('copy');done();}catch(e){syncMsg('复制失败：请长按文本框手动全选复制',true);}}
  try{
    if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(t).then(done,fallback);
    else fallback();
  }catch(e){fallback();}
});
$('bDownload').addEventListener('click',function(){
  var t=$('syncTxt').value||stateText();
  var name='四级词汇-同步-'+new Date().toISOString().slice(0,10)+'.json';
  try{
    var blob=new Blob([t],{type:'application/json'});
    var url=(window.URL||URL).createObjectURL(blob);
    var a=document.createElement('a');
    a.href=url;a.download=name;
    document.body.appendChild(a);a.click();
    setTimeout(function(){try{(window.URL||URL).revokeObjectURL(url);if(a.parentNode)a.parentNode.removeChild(a);}catch(e){}},500);
    syncMsg('已下载 '+name);
  }catch(e){syncMsg('这个环境不能下载文件，请改用「复制」把文本带走',true);}
});
$('bUndo').addEventListener('click',function(){try{undoImport();}catch(e){syncMsg('撤销失败：'+(e&&e.message?e.message:e),true);}var u=$('bUndo');if(u)u.style.display=hasBackup()?'':'none';});
$('bPick').addEventListener('click',function(){try{$('syncFile').click();}catch(e){syncMsg('这个环境不能选文件，请手动粘贴',true);}});
$('syncFile').addEventListener('change',function(){
  var f=this.files&&this.files[0];
  if(!f)return;
  try{
    var rd=new FileReader();
    rd.onload=function(){$('syncTxt').value=String(rd.result||'');syncMsg('已读入文件，点「导入」应用到这台设备');};
    rd.onerror=function(){syncMsg('读取文件失败',true);};
    rd.readAsText(f);
  }catch(e){syncMsg('读取文件失败，请手动粘贴',true);}
  this.value='';
});
$('bImport').addEventListener('click',function(){
  var raw=String($('syncTxt').value||'').trim();
  if(!raw){syncMsg('先把要导入的内容粘到上面的框（或点「选择文件」）',true);return;}
  var o;
  try{o=JSON.parse(cleanJson(raw));}catch(e){syncMsg('内容不是有效的 JSON：检查是否复制完整，或引号被输入法改成了全角',true);return;}
  var n=0;
  try{n=Object.keys((o&&o.data&&o.data.stars)||{}).length;}catch(e){}
  var mine=Object.keys(exportedStars()).length;
  var ask='导入会覆盖这台设备的进度：生词本 '+mine+' 个 → '+n+' 个，背单词位置也会一起换。\n\n确定导入吗？（导入后还能点「撤销上次导入」还原）';
  /* 安卓 WebView 没配 WebChromeClient，confirm 根本不会弹（默认当作取消），所以只在桌面/浏览器里问 */
  if(!(window&&window.AndroidTheme)&&typeof confirm==='function'&&!confirm(ask)){syncMsg('已取消，数据没动');return;}
  try{
    var r=applyState(o);
    syncMsg('已导入：生词本 '+r.stars+' 个，'+(r.mode==='star'?'只背生词':'全部单词')+'模式停在第 '+(r.pos+1)+' 张');
  }catch(err){syncMsg('导入失败：'+(err&&err.message?err.message:err),true);}
});

/* ---- init ---- */

$('ftotal').textContent=DATA.length;
$('order').value=pref.order;
$('mode').value=pref.mode;
paintStars();
buildOrder();
pos=slotOf(pref.mode);
if(pos<0)pos=0;
if(pos>orderArr.length-1)pos=Math.max(0,orderArr.length-1);
renderCard();
</script>
